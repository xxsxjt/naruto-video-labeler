[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naruto-mobile-video-analyzer"
version = "0.1.0"
description = "Offline visual event extraction for Naruto Mobile recordings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
naruto-video-analyzer = "naruto_video_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

