<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Naruto Mobile Video Analyzer · 标注器</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131b;color:#edf1f7}body{margin:0;max-width:1320px;padding:24px;margin-inline:auto}h1{font-size:22px;margin:0 0 8px}p{color:#aeb8c9}.inputs,.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}label{background:#1a2030;border:1px solid #33405a;border-radius:8px;padding:9px 12px;cursor:pointer}input{display:none}button{cursor:pointer;border:0;border-radius:7px;padding:9px 12px;font:inherit;color:#fff;background:#3758d4}button.reject{background:#7a3444}button.neutral{background:#354057}main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,.8fr);gap:18px}video{width:100%;max-height:640px;border-radius:10px;background:#000}aside{border:1px solid #33405a;border-radius:10px;overflow:hidden;background:#171d2a}#summary{padding:12px;border-bottom:1px solid #33405a;font-size:14px;color:#b7c6df}#events{max-height:620px;overflow:auto}.event{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #273147;cursor:pointer}.event:hover,.event.active{background:#28344d}.event.accepted{border-left:4px solid #39b97c}.event.rejected{opacity:.42;border-left:4px solid #d55c6c}.time{color:#9fb7ff;font-variant-numeric:tabular-nums}.score{color:#aeb8c9;font-size:12px}.hint{font-size:13px}#status{min-height:20px;color:#95a9cc}@media(max-width:850px){body{padding:14px}main{grid-template-columns:1fr}#events{max-height:360px}}
  </style>
</head>
<body>
  <h1>火影手游录像标注器</h1><p>离线运行。载入录像和分析器的候选事件 JSON，逐条确认或拒绝；不会读取或操作游戏客户端。</p>
  <div class="inputs"><label>选择录像 <input id="videoInput" type="file" accept="video/*"></label><label>选择候选报告 <input id="reportInput" type="file" accept="application/json,.json"></label><button class="neutral" id="acceptVisible">接受当前可见事件</button><button class="neutral" id="export">导出标注 JSON</button></div>
  <main><section><video id="video" controls></video><p class="hint">点击右侧事件会跳到对应时刻。绿色=已接受，红色=已拒绝。</p></section><aside><div id="summary">先载入报告 JSON。</div><div id="events"></div></aside></main>
  <div class="actions"><button id="accept">接受选中事件</button><button class="reject" id="reject">拒绝选中事件</button><button class="neutral" id="clear">清除本次标注</button></div><div id="status"></div>
  <script>
    const video=document.querySelector('#video'),list=document.querySelector('#events'),summary=document.querySelector('#summary'),status=document.querySelector('#status');let events=[],selected=null;
    const formatTime=value=>`${value.toFixed(2)}s`,setStatus=message=>status.textContent=message;
    function render(){list.replaceChildren();const counts=events.reduce((all,item)=>{all[item.decision||'unreviewed']=(all[item.decision||'unreviewed']||0)+1;return all},{});summary.textContent=`${events.length} 条候选事件 · 未审核 ${counts.unreviewed||0} · 接受 ${counts.accepted||0} · 拒绝 ${counts.rejected||0}`;events.forEach((event,index)=>{const row=document.createElement('div');row.className=`event ${event.decision||''} ${selected===index?'active':''}`;row.innerHTML=`<span class="time">${formatTime(event.timestamp_s)}</span><span>${event.event}<br><span class="score">${event.source} · score ${Number(event.score).toFixed(2)}</span></span><span>${event.decision==='accepted'?'✓':event.decision==='rejected'?'×':'·'}</span>`;row.onclick=()=>{selected=index;video.currentTime=event.timestamp_s;video.pause();render()};list.append(row)})}
    document.querySelector('#videoInput').onchange=event=>{const file=event.target.files[0];if(!file)return;video.src=URL.createObjectURL(file);setStatus(`已载入录像：${file.name}`)};
    document.querySelector('#reportInput').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{const report=JSON.parse(await file.text());events=(report.events||[]).map(item=>({...item,decision:null}));selected=events.length?0:null;render();setStatus(`已载入 ${file.name}`)}catch{setStatus('报告不是有效 JSON。')}};
    function decide(value){if(selected===null)return setStatus('请先选中一条事件。');events[selected].decision=value;render()}document.querySelector('#accept').onclick=()=>decide('accepted');document.querySelector('#reject').onclick=()=>decide('rejected');document.querySelector('#clear').onclick=()=>{events.forEach(event=>event.decision=null);render()};document.querySelector('#acceptVisible').onclick=()=>{const time=video.currentTime||0;events.filter(event=>Math.abs(event.timestamp_s-time)<.7).forEach(event=>event.decision='accepted');render()};
    document.querySelector('#export').onclick=()=>{const payload={schema_version:'0.1',video_filename:document.querySelector('#videoInput').files[0]?.name||null,created_at:new Date().toISOString(),labels:events.filter(event=>event.decision==='accepted'),rejected_candidates:events.filter(event=>event.decision==='rejected')};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='naruto-video-labels.json';link.click();URL.revokeObjectURL(link.href)};
  </script>
</body>
</html>
