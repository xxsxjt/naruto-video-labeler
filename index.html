<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>火影手游录像标注器</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131b;color:#edf1f7}body{max-width:1320px;margin:0 auto;padding:24px}h1{font-size:23px;margin:0 0 6px}p{color:#aeb8c9}.samples,.inputs,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}.sample{background:#354057}.sample.active{background:#3758d4;outline:2px solid #9fb7ff}label{background:#1a2030;border:1px solid #33405a;border-radius:8px;padding:9px 12px;cursor:pointer}input{display:none}button{cursor:pointer;border:0;border-radius:7px;padding:9px 12px;font:inherit;color:#fff;background:#3758d4}button.reject{background:#7a3444}button.neutral{background:#354057}main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,.8fr);gap:18px}video{width:100%;max-height:640px;border-radius:10px;background:#000}aside{border:1px solid #33405a;border-radius:10px;overflow:hidden;background:#171d2a}#summary{padding:12px;border-bottom:1px solid #33405a;font-size:14px;color:#b7c6df}#events{max-height:620px;overflow:auto}.event{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #273147;cursor:pointer}.event:hover,.event.active{background:#28344d}.event.accepted{border-left:4px solid #39b97c}.event.rejected{opacity:.42;border-left:4px solid #d55c6c}.time{color:#9fb7ff;font-variant-numeric:tabular-nums}.score{color:#aeb8c9;font-size:12px}.hint{font-size:13px}.coach-panel{margin-top:18px;border:1px solid #33405a;border-radius:10px;background:#171d2a;padding:14px}.coach-panel h2{font-size:17px;margin:0 0 8px}.coach-item{padding:9px 0;border-bottom:1px solid #273147}.coach-item:last-child{border-bottom:0}.coach-meta{color:#9fb7ff;font-size:12px}.coach-advice{margin:3px 0;color:#edf1f7}.coach-why{font-size:12px;color:#aeb8c9}#status{min-height:20px;color:#95a9cc}@media(max-width:850px){body{padding:14px}main{grid-template-columns:1fr}#events{max-height:360px}}
</style>
</head>
<body>
<h1>火影手游录像标注器</h1>
<p>预设样本可直接播放并载入离线候选片段；也可用本地录像和报告进行复盘。候选只供审核，不会读取或操作游戏客户端。</p>
<div class="samples" id="samples"></div>
<div class="inputs"><label>教练角色 <select id="profileInput"><option value="urashiki_astro_fisher">大筒木浦式·异星钓者</option><option value="kakashi_susanoo">旗木卡卡西·须佐能乎</option></select></label><label>本地录像 <input id="videoInput" type="file" accept="video/*"></label><label>本地候选报告 <input id="reportInput" type="file" accept="application/json,.json"></label><button class="neutral" id="acceptVisible">接受当前可见事件</button><button class="neutral" id="export">导出标注 JSON</button></div>
<main><section><video id="video" controls preload="metadata"></video><p class="hint">点击右侧候选会跳到对应时刻。绿色=已接受，红色=已拒绝；“视觉变化”不等于已确认的游戏操作。</p></section><aside><div id="summary">正在载入预设报告…</div><div id="events"></div></aside></main>
<section class="coach-panel"><h2>浦式离线战术教练</h2><div id="coachSummary">正在载入教练建议…</div><div id="coach"></div></section>
<div class="actions"><button id="accept">接受选中事件</button><button class="reject" id="reject">拒绝选中事件</button><button class="neutral" id="clear">清除本次标注</button></div><div id="status"></div>
<script>
const video=document.querySelector("#video"),list=document.querySelector("#events"),summary=document.querySelector("#summary"),status=document.querySelector("#status"),samplesBox=document.querySelector("#samples"),coachBox=document.querySelector("#coach"),coachSummary=document.querySelector("#coachSummary"),profileInput=document.querySelector("#profileInput");
const samples=[["2097","样本 1 · 9 秒"],["2514","样本 2 · 10 秒"],["20143","样本 3 · 12 秒"],["20789","样本 4 · 12 秒"],["2096","样本 5 · 30 秒"],["2636","样本 6 · 30 秒"]];
const labels={blue_ring_state:"自身蓝圈位置",red_ring_state:"敌方红圈位置",joystick_visual_change:"摇杆视觉变化",attack_visual_change:"普攻视觉变化",skill_1_visual_change:"技能 1 视觉变化",skill_2_visual_change:"技能 2 视觉变化",substitution_visual_change:"替身视觉变化",summon_or_secret_visual_change:"通灵/奥义视觉变化",impact_or_damage_flash:"受击/伤害闪光",health_bar_change:"血条变化"};
let events=[],selected=null,currentVideoName="";
const setStatus=message=>status.textContent=message;
const formatTime=value=>Number(value).toFixed(2)+"s";
function render(){
  list.replaceChildren();
  const counts=events.reduce((all,item)=>{const key=item.decision||"unreviewed";all[key]=(all[key]||0)+1;return all},{});
  summary.textContent=events.length+" 条候选事件 · 未审核 "+(counts.unreviewed||0)+" · 接受 "+(counts.accepted||0)+" · 拒绝 "+(counts.rejected||0);
  events.forEach((event,index)=>{
    const row=document.createElement("div");
    const duration=Number(event.evidence&&event.evidence.duration_s||0);
    const detail=event.source+" · score "+Number(event.score).toFixed(2)+(duration?(" · "+duration.toFixed(2)+"s"):"");
    row.className="event "+(event.decision||"")+" "+(selected===index?"active":"");
    row.innerHTML='<span class="time">'+formatTime(event.timestamp_s)+'</span><span>'+(labels[event.event]||event.event)+'<br><span class="score">'+detail+'</span></span><span>'+(event.decision==="accepted"?"✓":event.decision==="rejected"?"×":"·")+"</span>";
    row.onclick=()=>{selected=index;video.currentTime=event.timestamp_s;video.pause();render()};
    list.append(row);
  });
}
async function setReport(report){events=(report.events||[]).map(item=>Object.assign({},item,{decision:null}));selected=events.length?0:null;render();}
function renderCoaching(report){const items=(report.recommendations||[]);coachSummary.textContent=items.length+" 条浦式复盘建议 · 仅供人工审核";coachBox.replaceChildren();items.slice(0,12).forEach(item=>{const row=document.createElement("div");row.className="coach-item";row.innerHTML='<div class="coach-meta">'+formatTime(item.timestamp_s)+' · '+item.priority+' · 置信度 '+Number(item.confidence).toFixed(2)+'</div><div class="coach-advice">'+item.advice+'</div><div class="coach-why">'+item.rationale+'</div>';row.onclick=()=>{video.currentTime=item.timestamp_s;video.pause()};coachBox.append(row);});}
async function loadCoaching(id){const suffix=profileInput.value==="kakashi_susanoo"?"-kakashi":"";try{const response=await fetch("coaching/"+id+suffix+".json");if(!response.ok)throw new Error("coaching");renderCoaching(await response.json());}catch{coachSummary.textContent="此样本暂无教练报告；可在 analyzer 目录本地生成。";coachBox.replaceChildren();}}
async function loadSample(id){currentVideoName=id+".mp4";video.src=id+".mp4";video.load();document.querySelectorAll(".sample").forEach(button=>button.classList.toggle("active",button.dataset.id===id));setStatus("正在载入样本 "+id+"…");try{const response=await fetch("reports/"+id+".json");if(!response.ok)throw new Error("report");await setReport(await response.json());await loadCoaching(id);setStatus("已载入预设样本 "+id+"。");}catch{events=[];selected=null;render();setStatus("录像已载入，但对应报告暂不可用。");}}
samples.forEach(([id,label])=>{const button=document.createElement("button");button.className="sample";button.dataset.id=id;button.textContent=label;button.onclick=()=>loadSample(id);samplesBox.append(button);});
document.querySelector("#videoInput").onchange=event=>{const file=event.target.files[0];if(!file)return;currentVideoName=file.name;video.src=URL.createObjectURL(file);document.querySelectorAll(".sample").forEach(button=>button.classList.remove("active"));setStatus("已载入本地录像："+file.name);};
document.querySelector("#reportInput").onchange=async event=>{const file=event.target.files[0];if(!file)return;try{await setReport(JSON.parse(await file.text()));setStatus("已载入本地报告："+file.name);}catch{setStatus("报告不是有效 JSON。");}};
function decide(value){if(selected===null)return setStatus("请先选中一条事件。");events[selected].decision=value;render();}
document.querySelector("#accept").onclick=()=>decide("accepted");document.querySelector("#reject").onclick=()=>decide("rejected");document.querySelector("#clear").onclick=()=>{events.forEach(event=>event.decision=null);render();};
document.querySelector("#acceptVisible").onclick=()=>{const time=video.currentTime||0;events.filter(event=>Math.abs(event.timestamp_s-time)<.7).forEach(event=>event.decision="accepted");render();};
document.querySelector("#export").onclick=()=>{const payload={schema_version:"0.1",video_filename:currentVideoName||null,created_at:new Date().toISOString(),labels:events.filter(event=>event.decision==="accepted"),rejected_candidates:events.filter(event=>event.decision==="rejected")};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="naruto-video-labels.json";link.click();URL.revokeObjectURL(link.href);};
profileInput.onchange=()=>{const id=(currentVideoName||"2097.mp4").replace(".mp4","");loadCoaching(id)};
loadSample("2097");
</script>
</body></html>
