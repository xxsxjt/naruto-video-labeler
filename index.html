<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>火影手游录像复盘器</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131b;color:#edf1f7}body{max-width:1400px;margin:0 auto;padding:20px}h1{font-size:23px;margin:0 0 5px}p{color:#aeb8c9}.samples,.inputs,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:13px 0}.sample{background:#354057}.sample.active{background:#3758d4;outline:2px solid #9fb7ff}button{cursor:pointer;border:0;border-radius:7px;padding:8px 11px;font:inherit;color:#fff;background:#3758d4}button.reject{background:#7a3444}button.neutral{background:#354057}label{background:#1a2030;border:1px solid #33405a;border-radius:8px;padding:8px 11px;cursor:pointer}input{display:none}select{background:#1a2030;color:#fff;border:1px solid #33405a;border-radius:6px;padding:6px}.badge{display:inline-block;padding:3px 8px;border-radius:12px;background:#754d28;color:#ffd9a1;font-size:12px}.notice{padding:10px 12px;border:1px solid #6b4e2d;background:#2a2117;border-radius:8px;color:#f2cc95}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(350px,.75fr);gap:16px}.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;line-height:0}.stage video{width:100%;max-height:650px;display:block}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.timeline{position:relative;height:38px;margin:10px 0;background:#20283a;border-radius:6px;cursor:pointer}.timeline .marker{position:absolute;top:5px;width:4px;height:28px;background:#f1b54a;border-radius:3px}.timeline .marker.active{width:7px;background:#ff5d8f;box-shadow:0 0 0 2px #fff}.timeline .playhead{position:absolute;top:0;width:2px;height:38px;background:#6ed0ff}.legend{font-size:12px;color:#aeb8c9}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px}.legend .box{background:#ff5d8f}.legend .point{background:#54b9ff}.legend .range{background:#f1b54a}.panel{border:1px solid #33405a;border-radius:10px;overflow:hidden;background:#171d2a}.panel-title{padding:11px 12px;border-bottom:1px solid #33405a;color:#b7c6df;font-size:14px}.events{max-height:650px;overflow:auto}.event{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid #273147;cursor:pointer}.event:hover,.event.active{background:#28344d}.event.accepted{border-left:4px solid #39b97c}.event.rejected{opacity:.42;border-left:4px solid #d55c6c}.time{color:#9fb7ff;font-variant-numeric:tabular-nums}.score{color:#aeb8c9;font-size:12px}.event small{color:#aeb8c9}.hint{font-size:13px}#status{min-height:20px;color:#95a9cc}@media(max-width:850px){body{padding:12px}.layout{grid-template-columns:1fr}.events{max-height:420px}}
</style>
</head>
<body>
<h1>火影手游录像复盘器</h1>
<p>自动高亮候选画面与时间区间，供复盘和数据筛选。不会连接或操作游戏客户端。</p>
<div class="samples" id="samples"></div>
<div class="notice"><span class="badge">角色未知</span> 这六段样本没有经过角色身份确认，因此不会显示浦式或须佐卡卡西的角色策略，也不会被当作训练演示。</div>
<div class="inputs"><label>本地录像 <input id="videoInput" type="file" accept="video/*"></label><label>本地候选报告 <input id="reportInput" type="file" accept="application/json,.json"></label><label>显示 <select id="filter"><option value="all">全部候选</option><option value="high">高分候选</option><option value="accepted">已接受</option><option value="rejected">已拒绝</option></select></label><button class="neutral" id="acceptVisible">接受当前画面候选</button><button class="neutral" id="export">导出审核结果</button></div>
<div class="layout"><section><div class="stage"><video id="video" controls preload="metadata"></video><canvas id="overlay"></canvas></div><div id="timeline" class="timeline" title="点击跳转到对应时间"><div id="playhead" class="playhead"></div></div><div class="legend"><i class="box"></i>选中候选区域 <i class="point"></i>蓝/红圈位置 <i class="range"></i>候选时间点</div><p class="hint">播放视频时会自动高亮当前时间附近的候选；点击列表或时间轴可跳转。候选不是已确认的游戏动作。</p></section><aside class="panel"><div id="summary" class="panel-title">正在载入样本…</div><div id="events" class="events"></div></aside></div>
<div class="actions"><button id="accept">接受选中候选</button><button class="reject" id="reject">拒绝选中候选</button><button class="neutral" id="clear">清除本次审核</button></div><div id="status"></div>
<script>
const video=document.querySelector("#video"),overlay=document.querySelector("#overlay"),stage=document.querySelector(".stage"),list=document.querySelector("#events"),summary=document.querySelector("#summary"),status=document.querySelector("#status"),samplesBox=document.querySelector("#samples"),timeline=document.querySelector("#timeline"),playhead=document.querySelector("#playhead"),filter=document.querySelector("#filter");
const regions={arena:[.10,.33,.74,.62],joystick:[0,.72,.17,.26],attack:[.83,.70,.17,.30],skill_1:[.74,.60,.11,.18],skill_2:[.85,.49,.11,.19],substitution:[.74,.79,.11,.18],summon_or_secret:[.66,.79,.10,.16],self_health:[.10,.07,.18,.025],enemy_health:[.75,.07,.18,.025],impact_area:[.28,.35,.46,.50]};
const samples=[["2097","样本 1 · 9 秒"],["2514","样本 2 · 10 秒"],["20143","样本 3 · 12 秒"],["20789","样本 4 · 12 秒"],["2096","样本 5 · 30 秒"],["2636","样本 6 · 30 秒"]];
const labels={blue_ring_state:"自身蓝圈位置",red_ring_state:"敌方红圈位置",joystick_visual_change:"摇杆视觉变化",attack_visual_change:"普攻视觉变化",skill_1_visual_change:"技能 1 视觉变化",skill_2_visual_change:"技能 2 视觉变化",substitution_visual_change:"替身视觉变化",summon_or_secret_visual_change:"通灵/奥义视觉变化",impact_or_damage_flash:"受击/伤害闪光",health_bar_change:"血条变化"};
let events=[],selected=null,currentVideoName="",duration=0;
const setStatus=message=>status.textContent=message;
const interval=event=>{const e=event.evidence||{};const start=Number(e.segment_start_s??event.timestamp_s??0);const end=Number(e.segment_end_s??start);return [start,Math.max(start,end)]};
const displayEvents=()=>events.filter(event=>{const mode=filter.value;if(mode==="all")return true;if(mode==="high")return Number(event.score)>=50;return event.decision===mode});
function formatTime(value){return Number(value).toFixed(2)+"s"}
function render(){list.replaceChildren();const visible=displayEvents();const counts=events.reduce((all,item)=>{const key=item.decision||"unreviewed";all[key]=(all[key]||0)+1;return all},{});summary.textContent=events.length+" 条候选 · 当前显示 "+visible.length+" · 未审核 "+(counts.unreviewed||0)+" · 接受 "+(counts.accepted||0)+" · 拒绝 "+(counts.rejected||0);visible.forEach(event=>{const index=events.indexOf(event),row=document.createElement("div"),[start,end]=interval(event),span=Math.max(0,end-start);row.className="event "+(event.decision||"")+" "+(selected===index?"active":"");row.innerHTML='<span class="time">'+formatTime(start)+(span?".–"+formatTime(end):"")+'</span><span>'+(labels[event.event]||event.event)+'<br><small>'+event.source+" · score "+Number(event.score).toFixed(2)+(span?" · 持续 "+span.toFixed(2)+"s":"")+'</small></span><span>'+(event.decision==="accepted"?"✓":event.decision==="rejected"?"×":"·")+"</span>";row.onclick=()=>selectEvent(index);list.append(row)});renderTimeline();drawOverlay()}
function selectEvent(index){selected=index;const [start]=interval(events[index]);video.currentTime=start;video.pause();render()}
function renderTimeline(){timeline.querySelectorAll(".marker").forEach(item=>item.remove());const total=duration||Number(video.duration)||1;displayEvents().forEach(event=>{const [start,end]=interval(event),marker=document.createElement("div");marker.className="marker "+(events.indexOf(event)===selected?"active":"");marker.style.left=Math.max(0,Math.min(100,start/total*100))+"%";marker.title=(labels[event.event]||event.event)+" "+formatTime(start);marker.onclick=click=>{click.stopPropagation();selectEvent(events.indexOf(event))};timeline.append(marker)});playhead.style.left=Math.max(0,Math.min(100,(video.currentTime||0)/total*100))+"%"}
function resizeCanvas(){const rect=stage.getBoundingClientRect();overlay.width=Math.max(1,Math.round(rect.width));overlay.height=Math.max(1,Math.round(rect.height));drawOverlay()}
function drawOverlay(){const ctx=overlay.getContext("2d");ctx.clearRect(0,0,overlay.width,overlay.height);const now=video.currentTime||0;const active=events.filter(event=>{const [start,end]=interval(event);return now>=start-.18&&now<=Math.max(end,start+.35)});active.forEach(event=>{const region=regions[event.source];if(region){const [x,y,w,h]=region;ctx.strokeStyle=events.indexOf(event)===selected?"#ff5d8f":"#f1b54a";ctx.lineWidth=events.indexOf(event)===selected?4:2;ctx.strokeRect(x*overlay.width,y*overlay.height,w*overlay.width,h*overlay.height);ctx.fillStyle=ctx.strokeStyle;ctx.font="13px system-ui";ctx.fillText(labels[event.event]||event.event,x*overlay.width+4,y*overlay.height+15)}const evidence=event.evidence||{};if((event.event==="blue_ring_state"||event.event==="red_ring_state")&&regions.arena){const a=regions.arena,px=(a[0]+Number(evidence.arena_x||0)*a[2])*overlay.width,py=(a[1]+Number(evidence.arena_y||0)*a[3])*overlay.height;ctx.fillStyle=event.event==="blue_ring_state"?"#54b9ff":"#ff5d6c";ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fill()}})}
async function setReport(report){events=(report.events||[]).map(item=>Object.assign({},item,{decision:null}));duration=Number(report.video?.duration_s||0);selected=events.length?0:null;render()}
async function loadSample(id){currentVideoName=id+".mp4";video.src=id+".mp4";video.load();document.querySelectorAll(".sample").forEach(button=>button.classList.toggle("active",button.dataset.id===id));setStatus("正在载入样本 "+id+"…");try{const response=await fetch("reports/"+id+".json");if(!response.ok)throw new Error("report");await setReport(await response.json());setStatus("已载入样本 "+id+"：角色未确认，仅显示自动候选。")}catch{events=[];selected=null;render();setStatus("录像已载入，但报告不可用。")}}
samples.forEach(([id,label])=>{const button=document.createElement("button");button.className="sample";button.dataset.id=id;button.textContent=label;button.onclick=()=>loadSample(id);samplesBox.append(button)});
document.querySelector("#videoInput").onchange=event=>{const file=event.target.files[0];if(!file)return;currentVideoName=file.name;video.src=URL.createObjectURL(file);video.load();setStatus("已载入本地录像："+file.name)};
document.querySelector("#reportInput").onchange=async event=>{const file=event.target.files[0];if(!file)return;try{await setReport(JSON.parse(await file.text()));setStatus("已载入候选报告："+file.name)}catch{setStatus("报告不是有效 JSON。")}};
video.addEventListener("loadedmetadata",()=>{duration=Number(video.duration)||duration;resizeCanvas();renderTimeline()});video.addEventListener("timeupdate",()=>{renderTimeline();drawOverlay()});window.addEventListener("resize",resizeCanvas);filter.onchange=render;
timeline.onclick=event=>{const rect=timeline.getBoundingClientRect();video.currentTime=((event.clientX-rect.left)/rect.width)*(duration||video.duration||1);drawOverlay();renderTimeline()};
function decide(value){if(selected===null)return setStatus("请先选中一条候选。");events[selected].decision=value;render()}
document.querySelector("#accept").onclick=()=>decide("accepted");document.querySelector("#reject").onclick=()=>decide("rejected");document.querySelector("#clear").onclick=()=>{events.forEach(event=>event.decision=null);render()};document.querySelector("#acceptVisible").onclick=()=>{const now=video.currentTime||0;events.filter(event=>{const [start,end]=interval(event);return now>=start-.18&&now<=Math.max(end,start+.35)}).forEach(event=>event.decision="accepted");render()};
document.querySelector("#export").onclick=()=>{const payload={schema_version:"0.2",video_filename:currentVideoName||null,character_id:null,character_assignment:"unconfirmed",created_at:new Date().toISOString(),labels:events.filter(event=>event.decision==="accepted"),rejected_candidates:events.filter(event=>event.decision==="rejected"),notes:["Character identity and exact action semantics are not inferred automatically."]};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="naruto-video-review.json";link.click();URL.revokeObjectURL(link.href)};
loadSample("2097");
</script>
</body></html>
